<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ทรัพย์สิน">
<meta name="theme-color" content="#0B0A08">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>ทรัพย์สินส่วนตัว</title>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Instrument+Serif&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #0B0A08;
  --surface:   #14120D;
  --surface2:  #1D1A13;
  --hairline:  rgba(255,255,255,0.06);
  --border:    rgba(255,255,255,0.1);
  --border2:   rgba(255,255,255,0.14);
  --text:      #ECE8DF;
  --text-hi:   #F4EFE4;
  --muted:     #8D887C;
  --faint:     #5C5850;
  --accent:    #D8B36C;
  --danger:    #D67469;
  --positive:  #8FBF9F;
  --syncing:   #D8A657;
  --gold-grad: linear-gradient(135deg, #E2C182, #C79E55);
  --on-gold:   #171308;
  --font-th:   'Anuphan', sans-serif;
  --font-serif:'Instrument Serif', serif;
  --font-mono: 'IBM Plex Mono', monospace;
}

html { background: var(--bg); }
body {
  font-family: var(--font-th);
  background: radial-gradient(1100px 520px at 50% -8%, #191611, #0B0A08) fixed, var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding-bottom: env(safe-area-inset-bottom);
}
input, button, select { font-family: var(--font-th); }
input::placeholder { color: var(--faint); }

@keyframes fadeUp  { from { opacity:0; transform:translateY(10px);} to { opacity:1; transform:translateY(0);} }
@keyframes sheetUp { from { transform:translateY(40px); opacity:0;} to { transform:translateY(0); opacity:1;} }
@keyframes pulse   { 0%,100%{opacity:1} 50%{opacity:.3} }
@keyframes spin    { to { transform: rotate(360deg); } }

/* ===== SCREENS ===== */
.screen {
  display: none;
  width: 100%; max-width: 430px; min-height: 100vh;
  position: relative;
  border-left: 1px solid rgba(255,255,255,0.05);
  border-right: 1px solid rgba(255,255,255,0.05);
  flex-direction: column;
}
.screen.active { display: flex; }

/* ===== LOGIN ===== */
#s-login {
  align-items: center; justify-content: center;
  gap: 28px; padding: 48px 32px;
  text-align: center;
  animation: fadeUp .4s ease both;
}
.login-logo {
  width: 84px; height: 84px;
  border: 1px solid rgba(216,179,108,0.4);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: radial-gradient(circle at 35% 30%, rgba(216,179,108,0.14), rgba(216,179,108,0.02));
}
.login-logo span { font-family: var(--font-serif); font-size: 40px; color: var(--accent); line-height: 1; }
.login-head { display: flex; flex-direction: column; gap: 10px; }
.login-eyebrow { font-size: 12px; letter-spacing: 4px; color: var(--accent); font-family: var(--font-mono); text-transform: uppercase; }
.login-title { font-size: 28px; font-weight: 600; letter-spacing: -0.3px; }
.login-sub { font-size: 14px; color: var(--muted); line-height: 1.8; }
.google-btn {
  width: 100%; max-width: 320px; padding: 15px 20px;
  background: #16140F;
  border: 1px solid var(--border2);
  border-radius: 14px;
  color: var(--text); font-size: 15px; font-weight: 500;
  display: flex; align-items: center; justify-content: center; gap: 12px;
  cursor: pointer; transition: all .15s;
}
.google-btn:hover { background: var(--surface2); border-color: rgba(216,179,108,0.4); }
.google-btn:disabled { opacity: .5; cursor: not-allowed; }
.login-note { font-size: 12px; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 7px; }

/* ===== TOPBAR ===== */
.topbar {
  height: 60px; padding: 0 20px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--hairline);
  position: sticky; top: 0; z-index: 50; flex-shrink: 0;
  background: rgba(11,10,8,0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.topbar-left { display: flex; align-items: center; gap: 11px; }
.topbar-logo {
  width: 32px; height: 32px;
  border: 1px solid rgba(216,179,108,0.35);
  border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
}
.topbar-logo span { font-family: var(--font-serif); font-size: 17px; color: var(--accent); }
.topbar-title { font-size: 16px; font-weight: 600; }
.topbar-right { display: flex; align-items: center; gap: 14px; }
.sync-pill { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); font-family: var(--font-mono); }
.sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--positive); box-shadow: 0 0 6px var(--positive); transition: all .3s; }
.sync-dot.syncing { background: var(--syncing); box-shadow: 0 0 6px var(--syncing); animation: pulse .9s ease-in-out infinite; }
.sync-dot.error { background: var(--danger); box-shadow: none; animation: none; }
.user-btn {
  background: none; border: 1px solid var(--border);
  border-radius: 999px; padding: 5px 13px;
  font-size: 12px; color: var(--muted);
  cursor: pointer; transition: all .15s;
}
.user-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.25); }

/* ===== CONTENT ===== */
.content { flex: 1; overflow-y: auto; padding: 28px 20px 120px; -webkit-overflow-scrolling: touch; }

/* ===== TOTAL ===== */
.total-block { animation: fadeUp .4s ease both; }
.total-top { display: flex; align-items: center; justify-content: space-between; }
.total-label { font-size: 11px; letter-spacing: 3px; color: var(--accent); font-family: var(--font-mono); text-transform: uppercase; }
.eye-btn { background: none; border: none; cursor: pointer; padding: 4px; display: flex; color: var(--muted); transition: color .15s; }
.eye-btn:hover { color: var(--accent); }
.total-amount { margin-top: 8px; display: flex; align-items: baseline; gap: 8px; }
.total-amount .curr { font-family: var(--font-serif); font-size: 24px; color: var(--accent); }
.total-amount .num { font-family: var(--font-serif); font-size: 52px; line-height: 1.05; letter-spacing: -1px; color: var(--text-hi); }
.total-meta { margin-top: 10px; display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.total-meta .date { font-family: var(--font-mono); }
.total-rule { margin-top: 20px; height: 1px; background: linear-gradient(90deg, rgba(216,179,108,0.5), rgba(216,179,108,0.06)); }

/* ===== TREND ===== */
.trend-block { margin-top: 20px; animation: fadeUp .4s ease .05s both; }
.trend-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.trend-title { font-size: 11px; letter-spacing: 2px; color: var(--muted); font-family: var(--font-mono); text-transform: uppercase; }
.trend-badge { font-size: 11.5px; font-weight: 600; font-family: var(--font-mono); border-radius: 999px; padding: 3px 10px; }
.trend-badge.up   { color: var(--positive); background: rgba(143,191,159,0.1); border: 1px solid rgba(143,191,159,0.3); }
.trend-badge.down { color: var(--danger);   background: rgba(214,116,105,0.1);  border: 1px solid rgba(214,116,105,0.3); }
.trend-months { display: flex; justify-content: space-between; margin-top: 6px; font-size: 10.5px; color: var(--faint); font-family: var(--font-mono); }

/* ===== GOAL CARD ===== */
.goal-card {
  margin-top: 18px; padding: 15px 16px;
  border: 1px solid rgba(255,255,255,0.08); border-radius: 14px;
  cursor: pointer; transition: border-color .15s;
  animation: fadeUp .4s ease .1s both;
}
.goal-card:hover { border-color: rgba(216,179,108,0.4); }
.goal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.goal-name { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); font-weight: 500; }
.goal-pct { font-size: 12.5px; font-weight: 600; font-family: var(--font-mono); color: var(--accent); }
.goal-track { height: 5px; background: rgba(255,255,255,0.07); border-radius: 3px; overflow: hidden; }
.goal-fill { height: 100%; background: linear-gradient(90deg, #C79E55, #E2C182); border-radius: 3px; transition: width .4s ease; }
.goal-remain { margin-top: 8px; font-size: 11px; color: var(--muted); }

/* ===== CAT CHIPS ===== */
.cats-wrap { display: flex; gap: 8px; overflow-x: auto; padding: 18px 0 4px; scrollbar-width: none; }
.cats-wrap::-webkit-scrollbar { display: none; }
.cat-chip {
  flex-shrink: 0; padding: 7px 16px; border-radius: 999px;
  border: 1px solid var(--border); background: transparent;
  font-size: 12.5px; color: var(--muted);
  cursor: pointer; transition: all .15s; white-space: nowrap;
}
.cat-chip.active { border-color: rgba(216,179,108,0.6); color: var(--accent); background: rgba(216,179,108,0.12); }

/* ===== SECTION ===== */
.section-header { display: flex; align-items: center; justify-content: space-between; margin: 16px 0 6px; }
.section-title { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 2px; font-family: var(--font-mono); text-transform: uppercase; }
.section-count { font-size: 11px; color: var(--muted); font-family: var(--font-mono); }

/* ===== ASSET LIST ===== */
.asset-row {
  display: flex; align-items: center; gap: 14px;
  padding: 15px 2px;
  border-bottom: 1px solid var(--hairline);
  cursor: pointer; transition: background .15s;
  animation: fadeUp .35s ease both;
}
.asset-row:hover, .asset-row:active { background: rgba(255,255,255,0.025); }
.asset-icon {
  width: 42px; height: 42px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.asset-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.asset-name { font-size: 14.5px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.asset-cat { font-size: 12px; color: var(--muted); }
.asset-right { text-align: right; flex-shrink: 0; display: flex; flex-direction: column; gap: 3px; }
.asset-amt { font-size: 14.5px; font-weight: 600; font-family: var(--font-mono); color: var(--text); }
.asset-pct { font-size: 11px; color: var(--muted); font-family: var(--font-mono); }

/* ===== CHART BTN ===== */
.chart-btn {
  width: 100%; margin-top: 18px;
  background: none; border: 1px solid var(--border);
  border-radius: 12px; color: var(--muted);
  font-size: 13.5px; padding: 13px;
  cursor: pointer; transition: all .15s;
  display: flex; align-items: center; justify-content: center; gap: 9px;
}
.chart-btn:hover { color: var(--accent); border-color: rgba(216,179,108,0.4); }

/* ===== FAB ===== */
.fab {
  position: fixed; bottom: 26px; right: 20px;
  width: 58px; height: 58px; border-radius: 50%;
  background: var(--gold-grad); border: none;
  color: var(--on-gold);
  display: none; align-items: center; justify-content: center;
  cursor: pointer; box-shadow: 0 8px 28px rgba(216,179,108,0.35);
  transition: transform .2s; z-index: 60;
}
@media (min-width: 430px) { .fab { right: calc(50% - 215px + 20px); } }
.fab:hover { transform: scale(1.07); }
.fab:active { transform: scale(.94); }

/* ===== BOTTOM SHEET ===== */
.sheet-overlay {
  position: fixed; inset: 0;
  background: rgba(5,4,3,0.7);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  display: none; align-items: flex-end; justify-content: center; z-index: 100;
}
.sheet-overlay.open { display: flex; }
.sheet {
  background: var(--surface);
  border: 1px solid rgba(216,179,108,0.2); border-bottom: none;
  border-radius: 24px 24px 0 0;
  padding: 0 22px 40px;
  width: 100%; max-width: 430px;
  max-height: 92vh; overflow-y: auto;
  animation: sheetUp .28s ease both;
}
.sheet-handle { width: 36px; height: 4px; background: rgba(255,255,255,0.15); border-radius: 2px; margin: 14px auto 22px; }
.sheet-title { font-size: 18px; font-weight: 600; color: var(--text); margin-bottom: 22px; }

/* ===== FORM ===== */
.form-col { display: flex; flex-direction: column; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 7px; }
.field label { font-size: 12px; color: var(--muted); }
.field input {
  width: 100%; background: var(--bg);
  border: 1px solid var(--border2); border-radius: 12px;
  color: var(--text); font-size: 15px;
  padding: 13px 15px; outline: none; transition: border-color .15s;
  -webkit-appearance: none; appearance: none;
}
.field input:focus { border-color: rgba(216,179,108,0.55); }
.field input[type=number] { font-family: var(--font-mono); }
.cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cat-opt {
  display: flex; align-items: center; gap: 9px;
  padding: 11px 13px; border-radius: 11px;
  border: 1px solid var(--border); background: transparent;
  color: var(--muted); font-size: 13px;
  cursor: pointer; transition: all .15s; text-align: left;
}
.cat-opt svg { flex-shrink: 0; }
.sync-note { margin: 16px 0 18px; display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--accent); }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn-primary {
  padding: 14px; border-radius: 12px;
  background: var(--gold-grad); border: none;
  color: var(--on-gold); font-size: 14px; font-weight: 600;
  cursor: pointer; transition: all .15s;
}
.btn-primary:hover { filter: brightness(1.08); }
.btn-primary:disabled { opacity: .4; cursor: not-allowed; }
.btn-secondary {
  padding: 14px; border-radius: 12px;
  background: var(--surface2); border: 1px solid rgba(255,255,255,0.08);
  color: var(--muted); font-size: 14px;
  cursor: pointer; transition: all .15s;
}
.btn-secondary:hover { color: var(--text); }
.btn-danger {
  width: 100%; margin-top: 12px; padding: 13px; border-radius: 12px;
  background: rgba(214,116,105,0.07); border: 1px solid rgba(214,116,105,0.25);
  color: var(--danger); font-size: 14px;
  cursor: pointer; transition: all .15s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-danger:hover { background: rgba(214,116,105,0.14); }

/* ===== CHART SHEET ===== */
.donut-wrap { display: flex; justify-content: center; padding: 16px 0 8px; position: relative; }
.donut-center {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  pointer-events: none;
}
.donut-center .lbl { font-size: 10px; letter-spacing: 2px; color: var(--muted); font-family: var(--font-mono); }
.donut-center .val { font-family: var(--font-serif); font-size: 22px; color: var(--text-hi); }
.legend { display: flex; flex-direction: column; }
.legend-row { display: flex; align-items: center; gap: 11px; padding: 11px 0; border-bottom: 1px solid var(--hairline); }
.legend-dot { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }
.legend-name { flex: 1; font-size: 13.5px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.legend-val { font-size: 11.5px; font-family: var(--font-mono); color: var(--muted); }
.legend-pct { font-size: 12.5px; font-weight: 600; font-family: var(--font-mono); color: var(--text); min-width: 48px; text-align: right; }

/* ===== STATES ===== */
.loading-wrap { display: flex; flex-direction: column; align-items: center; padding: 3rem 1rem; gap: 14px; }
.loading-ring { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--accent); animation: spin .7s linear infinite; }
.loading-text { font-size: 13px; color: var(--muted); }
.empty-state { text-align: center; padding: 48px 16px; color: var(--muted); font-size: 14px; line-height: 2; }
.empty-state .ic { margin-bottom: 8px; display: flex; justify-content: center; }
.error-card {
  background: rgba(214,116,105,0.07); border: 1px solid rgba(214,116,105,0.18);
  border-radius: 14px; padding: 18px; text-align: center;
  color: var(--danger); font-size: 13px; line-height: 1.8;
}
.retry-btn {
  margin-top: 12px; padding: 8px 22px; border-radius: 999px;
  background: rgba(214,116,105,0.1); border: 1px solid rgba(214,116,105,0.22);
  color: var(--danger); font-size: 13px; cursor: pointer;
}
</style>
</head>
<body>

<!-- ========== LOGIN ========== -->
<div class="screen active" id="s-login">
  <div class="login-logo"><span>฿</span></div>
  <div class="login-head">
    <div class="login-eyebrow">Private Wealth</div>
    <div class="login-title">ทรัพย์สินส่วนตัว</div>
    <div class="login-sub">เข้าสู่ระบบด้วย Google Account<br>เฉพาะบัญชีที่ได้รับสิทธิ์เท่านั้น</div>
  </div>
  <button class="google-btn" id="signin-btn" onclick="signIn()">
    <svg width="19" height="19" viewBox="0 0 18 18" aria-hidden="true">
      <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
      <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/>
      <path fill="#FBBC05" d="M3.964 10.71c-.18-.54-.282-1.117-.282-1.71s.102-1.17.282-1.71V4.958H.957C.347 6.173 0 7.548 0 9s.347 2.827.957 4.042l3.007-2.332z"/>
      <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
    </svg>
    เข้าสู่ระบบด้วย Google
  </button>
  <div class="login-note">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8D887C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 018 0v3"></path></svg>
    ปลอดภัยด้วย Google OAuth 2.0
  </div>
</div>

<!-- ========== MAIN ========== -->
<div class="screen" id="s-main">
  <nav class="topbar">
    <div class="topbar-left">
      <div class="topbar-logo"><span>฿</span></div>
      <span class="topbar-title">ทรัพย์สิน</span>
    </div>
    <div class="topbar-right">
      <div class="sync-pill">
        <div class="sync-dot" id="sync-dot"></div>
        <span id="sync-label">Synced</span>
      </div>
      <button class="user-btn" id="user-btn" onclick="signOut()">ออกจากระบบ</button>
    </div>
  </nav>
  <div class="content" id="main-content">
    <div class="loading-wrap">
      <div class="loading-ring"></div>
      <div class="loading-text">กำลังโหลดข้อมูล...</div>
    </div>
  </div>
</div>

<!-- ========== FAB ========== -->
<button class="fab" id="fab" onclick="openAddSheet()" aria-label="เพิ่มรายการ">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
</button>

<!-- ========== EDIT / ADD SHEET ========== -->
<div class="sheet-overlay" id="edit-overlay" onclick="overlayClose(event,'edit-overlay')">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="edit-title">เพิ่มรายการ</div>
    <input type="hidden" id="edit-row">
    <input type="hidden" id="edit-id">
    <input type="hidden" id="f-cat">
    <div class="form-col">
      <div class="field">
        <label>ชื่อรายการ</label>
        <input type="text" id="f-name" placeholder="เช่น บัญชีออมทรัพย์">
      </div>
      <div class="field">
        <label>จำนวนเงิน (บาท)</label>
        <input type="number" id="f-amount" placeholder="0" inputmode="decimal" min="0">
      </div>
      <div class="field">
        <label>ประเภท</label>
        <div class="cat-grid" id="cat-grid"></div>
      </div>
    </div>
    <div class="sync-note">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#D8B36C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>
      บันทึกจะซิงค์ไป Google Sheets ทันที
    </div>
    <div class="btn-row">
      <button class="btn-secondary" onclick="closeSheet('edit-overlay')">ยกเลิก</button>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
// ================================================================
//  ⚙️  CONFIG — แก้ค่า 2 บรรทัดนี้ก่อนใช้งาน
// ================================================================
const CLIENT_ID      = '886947640146-ru7uc030l5liqo7r292k3ffjkjvj1pde.apps.googleusercontent.com';
const SPREADSHEET_ID = '1B86lOJ9MXTAsKa_jeRwIkCH2wF-EfXpmpU4p12bqajw';
// ================================================================

const SHEET_NAME    = 'ทรัพย์สิน';
const HISTORY_SHEET = 'ประวัติ';
const SCOPES        = 'https://www.googleapis.com/auth/spreadsheets';
const BASE_URL      = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}`;

let tokenClient  = null;
let accessToken  = null;
let tokenExpiry  = 0;
let assets       = [];
let activeCat    = 'ทั้งหมด';
let syncTimer    = null;
let sheetIdCache = null;
let history      = [];      // [{ key:'2026-07', total: 123456 }]
let historyReady = false;   // snapshot/ensure done this session
let hiddenAmts   = localStorage.getItem('at_hidden') === '1';
let goal         = parseFloat(localStorage.getItem('at_goal')) || 2000000;

// ---- CATEGORY META (SVG line icons) ----
const CATS = {
  'กองทุน':           { color: '#8FBF9F', iconD: 'M4 19h16M4 19V5M7.5 15l3.2-4 2.8 2.3 4.5-5.8' },

  'หุ้น / สหกรณ์':   { color: '#C98A6B', iconD: 'M14 7h5v5M19 7l-7 8-3-3-5 5' },

  'อสังหาริมทรัพย์':  { color: '#BF8FA6', iconD: 'M5 21V5a1 1 0 011-1h8a1 1 0 011 1v16M15 9h3a1 1 0 011 1v11M3 21h18M8 8h2M8 12h2M8 16h2' },
  'ทอง':              { color: '#D8B36C', iconD: 'M4 19l1.5-5h5L12 19zM12 19l1.5-5h5L20 19zM8 12l1.5-5h5L16 12z' },
  'อื่นๆ':            { color: '#8D887C', iconD: 'M4 8h16a1 1 0 011 1v10a1 1 0 01-1 1H4a1 1 0 01-1-1V9a1 1 0 011-1zM9 8V6a2 2 0 012-2h2a2 2 0 012 2v2M3 13h18' },
};
const FORM_CATS = Object.keys(CATS);
const EYE_OPEN   = 'M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z';
const EYE_CLOSED = 'M3 3l18 18M10.6 5.1A10.4 10.4 0 0112 5c5 0 9 4.5 10 7-.4 1-1.3 2.4-2.6 3.7M6.6 6.6C4.1 8.1 2.5 10.5 2 12c1 2.5 5 7 10 7 1.5 0 2.9-.4 4.2-1';
const TH_MONTHS  = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

function getMeta(cat) { return CATS[cat] || CATS['อื่นๆ']; }
function catIcon(cat, size, strokeColor, strokeW) {
  const m = getMeta(cat);
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${strokeColor || m.color}" stroke-width="${strokeW || 1.6}" stroke-linecap="round" stroke-linejoin="round"><path d="${m.iconD}"></path></svg>`;
}

// ================================================================
//  AUTH
// ================================================================
// เก็บ token ไว้ในเครื่อง (อายุ ~1 ชม.) เพื่อไม่ต้อง login ใหม่ทุกครั้งที่สลับแอป
const TOKEN_KEY = 'at_token';
function saveToken() {
  try { localStorage.setItem(TOKEN_KEY, JSON.stringify({ t: accessToken, e: tokenExpiry })); } catch (e) {}
}
function clearSavedToken() {
  try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
}
function restoreToken() {
  try {
    const v = JSON.parse(localStorage.getItem(TOKEN_KEY) || 'null');
    if (v && v.t && Date.now() < v.e) { accessToken = v.t; tokenExpiry = v.e; return true; }
  } catch (e) {}
  return false;
}
// มือถือ / แอปที่ติดตั้งบนหน้าจอหลัก → ใช้การ redirect แทน popup (popup มักถูกบล็อกบนมือถือ)
const IS_MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
  || window.matchMedia('(display-mode: standalone)').matches
  || window.navigator.standalone === true;
// ต้องตรงกับ Authorized redirect URI ใน Google Cloud เป๊ะ (ตัด index.html ออก, บังคับ / ปิดท้าย)
const REDIRECT_URI = location.origin + location.pathname.replace(/index\.html$/, '').replace(/\/?$/, '/');

function startSession() {
  showScreen('s-main');
  document.getElementById('fab').style.display = 'flex';
  loadData();
}

// รับ token ที่ Google ส่งกลับมาทาง URL (#access_token=...)
function handleRedirectReturn() {
  if (!location.hash.includes('access_token') && !location.hash.includes('error=')) return false;
  const h = new URLSearchParams(location.hash.slice(1));
  window.history.replaceState(null, '', REDIRECT_URI);  // ล้าง token ออกจาก URL
  let expected = null;
  try { expected = sessionStorage.getItem('at_oauth_state') || localStorage.getItem('at_oauth_state'); } catch (e) {}
  try { sessionStorage.removeItem('at_oauth_state'); localStorage.removeItem('at_oauth_state'); } catch (e) {}
  if (h.get('error')) {
    setTimeout(() => alert('เข้าสู่ระบบไม่สำเร็จ: ' + h.get('error')), 300);
    return false;
  }
  if (expected && h.get('state') !== expected) {
    setTimeout(() => alert('เข้าสู่ระบบไม่สำเร็จ (state ไม่ตรง) กรุณาลองใหม่'), 300);
    return false;
  }
  accessToken = h.get('access_token');
  tokenExpiry = Date.now() + ((parseInt(h.get('expires_in')) || 3600) - 120) * 1000;
  saveToken();
  return true;
}

function signInRedirect() {
  const state = Math.random().toString(36).slice(2) + Date.now().toString(36);
  try { sessionStorage.setItem('at_oauth_state', state); localStorage.setItem('at_oauth_state', state); } catch (e) {}
  const q = new URLSearchParams({
    client_id: CLIENT_ID,
    redirect_uri: REDIRECT_URI,
    response_type: 'token',
    scope: SCOPES,
    include_granted_scopes: 'true',
    state,
  });
  location.href = 'https://accounts.google.com/o/oauth2/v2/auth?' + q.toString();
}

if (handleRedirectReturn() || restoreToken()) {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', startSession);
  else startSession();
}

window.addEventListener('load', () => {
  const wait = setInterval(() => {
    if (window.google?.accounts?.oauth2) {
      clearInterval(wait);
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: onToken,
        error_callback: (err) => {
          document.getElementById('signin-btn').disabled = false;
          // popup เปิดไม่ได้/ถูกปิด → สลับไปใช้ redirect
          if (err && (err.type === 'popup_failed_to_open' || err.type === 'popup_closed')) signInRedirect();
          else alert('เข้าสู่ระบบไม่สำเร็จ: ' + (err?.message || err?.type || 'unknown'));
        },
      });
    }
  }, 100);
});

function signIn() {
  if (IS_MOBILE) { signInRedirect(); return; }
  if (!tokenClient) { signInRedirect(); return; }
  document.getElementById('signin-btn').disabled = true;
  tokenClient.requestAccessToken({ prompt: '' });
}

function onToken(resp) {
  document.getElementById('signin-btn').disabled = false;
  if (resp.error) {
    alert('เข้าสู่ระบบไม่สำเร็จ: ' + resp.error);
    return;
  }
  accessToken = resp.access_token;
  tokenExpiry  = Date.now() + (resp.expires_in - 120) * 1000;
  saveToken();
  startSession();
}

function ensureToken() {
  if (!accessToken || Date.now() > tokenExpiry) {
    if (IS_MOBILE || !tokenClient) {
      // token หมดอายุ → กลับหน้า login ให้กดเข้าใหม่
      accessToken = null; clearSavedToken(); clearInterval(syncTimer);
      showScreen('s-login');
      document.getElementById('fab').style.display = 'none';
    } else {
      tokenClient.requestAccessToken({ prompt: '' });
    }
    return false;
  }
  return true;
}

function signOut() {
  if (!confirm('ออกจากระบบ?')) return;
  if (accessToken && window.google?.accounts?.oauth2) google.accounts.oauth2.revoke(accessToken, () => {});
  accessToken = null;
  clearSavedToken();
  clearInterval(syncTimer);
  assets = [];
  history = [];
  historyReady = false;
  showScreen('s-login');
  document.getElementById('fab').style.display = 'none';
}

// ================================================================
//  SCREENS
// ================================================================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ================================================================
//  SHEETS API
// ================================================================
async function api(path, opts = {}) {
  if (!ensureToken()) throw new Error('auth');
  const url = path.startsWith('http') ? path : BASE_URL + path;
  const r = await fetch(url, {
    ...opts,
    headers: {
      Authorization: 'Bearer ' + accessToken,
      'Content-Type': 'application/json',
      ...(opts.headers || {}),
    },
  });
  if (r.status === 401) {
    accessToken = null; tokenExpiry = 0; clearSavedToken();
    clearInterval(syncTimer);
    showScreen('s-login');
    document.getElementById('fab').style.display = 'none';
    throw new Error('auth');
  }
  if (!r.ok) {
    const e = await r.json().catch(() => ({}));
    throw new Error(e.error?.message || `HTTP ${r.status}`);
  }
  return r.json();
}

async function loadData(quiet = false) {
  if (!quiet) setSyncState('syncing');
  try {
    // Ensure header row exists
    const check = await api(`/values/${enc(SHEET_NAME)}!A1:D1`);
    if (!check.values?.[0]?.[0]) {
      await api(`/values/${enc(SHEET_NAME)}!A1:D1?valueInputOption=RAW`, {
        method: 'PUT',
        body: JSON.stringify({ values: [['id','name','amount','category']] }),
      });
    }

    const resp = await api(`/values/${enc(SHEET_NAME)}!A2:D`);
    const rows = resp.values || [];

    assets = rows
      .filter(r => r[0] && r[1])
      .map((r, i) => ({
        row:      i + 2,
        id:       parseInt(r[0]) || i + 1,
        name:     r[1] || '',
        amount:   parseFloat((r[2] || '0').replace(/,/g, '')) || 0,
        category: r[3] || 'อื่นๆ',
      }));

    // history: ensure tab + monthly snapshot (once per session, non-fatal)
    if (!historyReady) {
      try { await initHistory(); } catch (e) { console.warn('history:', e.message); }
      historyReady = true;
    }

    renderAll();
    setSyncState('ok');

    clearInterval(syncTimer);
    syncTimer = setInterval(() => loadData(true), 30000);
  } catch (e) {
    if (e.message === 'auth') return;
    setSyncState('error');
    document.getElementById('main-content').innerHTML = `
      <div class="error-card">
        โหลดข้อมูลไม่สำเร็จ<br>
        <small style="opacity:.7">${esc(e.message)}</small><br>
        <button class="retry-btn" onclick="loadData()">ลองใหม่</button>
      </div>`;
  }
}

async function writeAsset(asset, rowNum) {
  setSyncState('syncing');
  const vals = [[asset.id, asset.name, asset.amount, asset.category]];
  if (rowNum) {
    await api(`/values/${enc(SHEET_NAME)}!A${rowNum}:D${rowNum}?valueInputOption=RAW`, {
      method: 'PUT',
      body: JSON.stringify({ values: vals }),
    });
  } else {
    await api(`/values/${enc(SHEET_NAME)}!A:D:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS`, {
      method: 'POST',
      body: JSON.stringify({ values: vals }),
    });
  }
}

async function getSheetId() {
  if (sheetIdCache !== null) return sheetIdCache;
  const meta = await api('?fields=sheets.properties');
  const sheet = meta.sheets.find(s => s.properties.title === SHEET_NAME);
  if (!sheet) throw new Error('ไม่พบ Sheet ชื่อ "' + SHEET_NAME + '"');
  sheetIdCache = sheet.properties.sheetId;
  return sheetIdCache;
}

async function deleteRow(rowNum) {
  const sheetId = await getSheetId();
  await api(':batchUpdate', {
    method: 'POST',
    body: JSON.stringify({
      requests: [{
        deleteDimension: {
          range: { sheetId, dimension: 'ROWS', startIndex: rowNum - 1, endIndex: rowNum },
        },
      }],
    }),
  });
}

function enc(s) { return encodeURIComponent(s); }

// ================================================================
//  HISTORY (แท็บ "ประวัติ": snapshot ยอดรวมรายเดือน)
// ================================================================
function monthKey(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; }
function monthLabel(key) {
  const [y, m] = key.split('-').map(Number);
  return `${TH_MONTHS[(m - 1) % 12]} ${String((y + 543) % 100).padStart(2, '0')}`;
}

async function initHistory() {
  // ensure tab exists
  const meta = await api('?fields=sheets.properties');
  if (!meta.sheets.some(s => s.properties.title === HISTORY_SHEET)) {
    await api(':batchUpdate', {
      method: 'POST',
      body: JSON.stringify({ requests: [{ addSheet: { properties: { title: HISTORY_SHEET } } }] }),
    });
    await api(`/values/${enc(HISTORY_SHEET)}!A1:B1?valueInputOption=RAW`, {
      method: 'PUT',
      body: JSON.stringify({ values: [['เดือน', 'ยอดรวม']] }),
    });
  }
  // load rows
  const resp = await api(`/values/${enc(HISTORY_SHEET)}!A2:B`);
  history = (resp.values || [])
    .filter(r => r[0] && /^\d{4}-\d{2}$/.test(r[0]))
    .map(r => ({ key: r[0], total: parseFloat(String(r[1] || '0').replace(/,/g, '')) || 0 }))
    .sort((a, b) => a.key.localeCompare(b.key));
  // snapshot ครั้งแรกของเดือน
  const key = monthKey(new Date());
  if (!history.some(h => h.key === key)) {
    const total = assets.reduce((s, a) => s + a.amount, 0);
    await api(`/values/${enc(HISTORY_SHEET)}!A:B:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS`, {
      method: 'POST',
      body: JSON.stringify({ values: [[key, total]] }),
    });
    history.push({ key, total });
  }
}

// ================================================================
//  SYNC STATUS
// ================================================================
function setSyncState(state) {
  const dot   = document.getElementById('sync-dot');
  const label = document.getElementById('sync-label');
  if (state === 'syncing')    { dot.className = 'sync-dot syncing'; label.textContent = 'Syncing…'; }
  else if (state === 'error') { dot.className = 'sync-dot error';   label.textContent = 'ซิงค์ไม่สำเร็จ'; }
  else                        { dot.className = 'sync-dot';         label.textContent = 'Synced'; }
}

// ================================================================
//  RENDER
// ================================================================
function fmt(n) { return Math.round(n).toLocaleString('en-US'); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function money(n) { return hiddenAmts ? '•••••' : '฿' + fmt(n); }

function renderAll() {
  const total   = assets.reduce((s, a) => s + a.amount, 0);
  const visible = activeCat === 'ทั้งหมด' ? assets : assets.filter(a => a.category === activeCat);
  const sorted  = [...visible].sort((a, b) => b.amount - a.amount);

  let html = renderTotal(total) + renderTrend(total) + renderGoal(total) + renderChips();

  html += `
    <div class="section-header">
      <span class="section-title">รายการทรัพย์สิน</span>
      <span class="section-count">${String(sorted.length).padStart(2, '0')}</span>
    </div>`;

  if (sorted.length === 0) {
    html += `<div class="empty-state">
      <div class="ic"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#5C5850" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h16a1 1 0 011 1v10a1 1 0 01-1 1H4a1 1 0 01-1-1V9a1 1 0 011-1zM9 8V6a2 2 0 012-2h2a2 2 0 012 2v2"></path></svg></div>
      ไม่มีรายการในหมวดนี้
    </div>`;
  } else {
    html += `<div>`;
    sorted.forEach((a, i) => { html += renderRow(a, total, i); });
    html += `</div>`;
  }

  html += `
    <button class="chart-btn" onclick="openChart()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-9-9"></path><path d="M12 3a9 9 0 019 9h-9z"></path></svg>
      ดูสัดส่วนทรัพย์สิน
    </button>`;

  document.getElementById('main-content').innerHTML = html;
}

function renderTotal(total) {
  const now = new Date();
  const d = now.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' });
  const eyeD = hiddenAmts ? EYE_CLOSED : EYE_OPEN;
  const dot  = hiddenAmts ? '' : '<circle cx="12" cy="12" r="3"></circle>';
  return `
  <div class="total-block">
    <div class="total-top">
      <span class="total-label">มูลค่ารวมทั้งหมด</span>
      <button class="eye-btn" onclick="toggleHide()" aria-label="ซ่อนยอดเงิน">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="${eyeD}"></path>${dot}</svg>
      </button>
    </div>
    <div class="total-amount">
      <span class="curr">฿</span>
      <span class="num">${hiddenAmts ? '•••••••' : fmt(total)}</span>
    </div>
    <div class="total-meta">
      <span>${assets.length} รายการ</span>
      <span class="date">อัปเดต ${d}</span>
    </div>
    <div class="total-rule"></div>
  </div>`;
}

function renderTrend(total) {
  const curKey = monthKey(new Date());
  const past = history.filter(h => h.key !== curKey).slice(-11);
  let series = [...past.map(h => h.total), total];
  let firstLabel = past.length ? monthLabel(past[0].key) : monthLabel(curKey);
  const lastLabel = monthLabel(curKey);
  if (series.length === 1) series = [series[0], series[0]];

  const min = Math.min(...series), max = Math.max(...series);
  const span = max - min || 1;
  const pts = series.map((v, i) => [
    i / (series.length - 1) * 320,
    76 - (v - min) / span * 64,
  ]);
  const line = 'M' + pts.map(p => `${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join('L');
  const area = line + 'L320 84L0 84Z';
  const last = pts[pts.length - 1];

  const prev = series[series.length - 2];
  const pct  = prev ? (total - prev) / prev * 100 : 0;
  const up   = pct >= 0;

  return `
  <div class="trend-block">
    <div class="trend-head">
      <span class="trend-title">แนวโน้ม 12 เดือน</span>
      <span class="trend-badge ${up ? 'up' : 'down'}">${up ? '+' : ''}${pct.toFixed(1)}% MoM</span>
    </div>
    <svg width="100%" height="84" viewBox="0 0 320 84" preserveAspectRatio="none" style="display:block">
      <defs>
        <linearGradient id="trend-fill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="rgba(216,179,108,0.22)"></stop>
          <stop offset="1" stop-color="rgba(216,179,108,0)"></stop>
        </linearGradient>
      </defs>
      <path d="${area}" fill="url(#trend-fill)"></path>
      <path d="${line}" fill="none" stroke="#D8B36C" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"></path>
      <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3.2" fill="#D8B36C"></circle>
    </svg>
    <div class="trend-months">
      <span>${firstLabel}</span>
      <span>${lastLabel}</span>
    </div>
  </div>`;
}

function renderGoal(total) {
  const frac   = goal ? Math.min(total / goal, 1) : 0;
  const remain = Math.max(goal - total, 0);
  const remainText = remain > 0
    ? (hiddenAmts ? 'เหลืออีก ••••• ถึงเป้าหมาย' : `เหลืออีก ฿${fmt(remain)} ถึงเป้าหมาย`)
    : 'ถึงเป้าหมายแล้ว';
  return `
  <div class="goal-card" onclick="openGoalSheet()">
    <div class="goal-head">
      <div class="goal-name">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#D8B36C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><circle cx="12" cy="12" r="1"></circle></svg>
        <span>เป้าหมาย ${money(goal)}</span>
      </div>
      <span class="goal-pct">${(frac * 100).toFixed(1)}%</span>
    </div>
    <div class="goal-track"><div class="goal-fill" style="width:${(frac * 100).toFixed(1)}%"></div></div>
    <div class="goal-remain">${remainText}</div>
  </div>`;
}

function renderChips() {
  const cats = ['ทั้งหมด', ...Object.keys(CATS).filter(c => assets.some(a => a.category === c)),
                ...[...new Set(assets.map(a => a.category))].filter(c => !CATS[c])];
  return `<div class="cats-wrap">
    ${cats.map(c => `<button class="cat-chip${c === activeCat ? ' active' : ''}" onclick="filterCat('${c.replace(/'/g, "\\'")}')">${esc(c)}</button>`).join('')}
  </div>`;
}

function renderRow(a, total, idx) {
  const m   = getMeta(a.category);
  const pct = total > 0 ? (a.amount / total * 100).toFixed(1) : '0.0';
  return `
  <div class="asset-row" style="animation-delay:${idx * 0.035}s" onclick="openEditSheet(${a.row})">
    <div class="asset-icon" style="border:1px solid ${m.color}4D">
      ${catIcon(a.category, 20)}
    </div>
    <div class="asset-body">
      <span class="asset-name">${esc(a.name)}</span>
      <span class="asset-cat">${esc(a.category)}</span>
    </div>
    <div class="asset-right">
      <span class="asset-amt">${money(a.amount)}</span>
      <span class="asset-pct">${pct}%</span>
    </div>
  </div>`;
}

function filterCat(cat) { activeCat = cat; renderAll(); }
function toggleHide() {
  hiddenAmts = !hiddenAmts;
  localStorage.setItem('at_hidden', hiddenAmts ? '1' : '0');
  renderAll();
}

// ================================================================
//  EDIT / ADD SHEET
// ================================================================
function renderCatGrid(selected) {
  document.getElementById('f-cat').value = selected;
  document.getElementById('cat-grid').innerHTML = FORM_CATS.map((c, i) => {
    const m = CATS[c];
    const active = c === selected;
    const style = active
      ? `border-color:${m.color}99;background:${m.color}1A;color:var(--text)`
      : '';
    return `<button type="button" class="cat-opt" style="${style}" onclick="pickCat(${i})">
      ${catIcon(c, 16, active ? m.color : '#8D887C')}
      ${esc(c)}
    </button>`;
  }).join('');
}
function pickCat(i) { renderCatGrid(FORM_CATS[i]); }

function openAddSheet() {
  const maxId = assets.length ? Math.max(...assets.map(a => a.id)) : 0;
  document.getElementById('edit-title').textContent = 'เพิ่มรายการ';
  document.getElementById('edit-row').value   = '';
  document.getElementById('edit-id').value    = maxId + 1;
  document.getElementById('f-name').value     = '';
  document.getElementById('f-amount').value   = '';
  renderCatGrid('กองทุน');
  document.getElementById('delete-btn').style.display = 'none';
  openSheet('edit-overlay');
  setTimeout(() => document.getElementById('f-name').focus(), 150);
}

function openEditSheet(row) {
  const a = assets.find(x => x.row === row);
  if (!a) return;
  document.getElementById('edit-title').textContent = 'แก้ไขรายการ';
  document.getElementById('edit-row').value   = row;
  document.getElementById('edit-id').value    = a.id;
  document.getElementById('f-name').value     = a.name;
  document.getElementById('f-amount').value   = a.amount;
  renderCatGrid(CATS[a.category] ? a.category : 'อื่นๆ');
  document.getElementById('delete-btn').style.display = 'flex';
  openSheet('edit-overlay');
}

async function saveAsset() {
  const name   = document.getElementById('f-name').value.trim();
  const amount = parseFloat(document.getElementById('f-amount').value);
  const cat    = document.getElementById('f-cat').value;
  const row    = parseInt(document.getElementById('edit-row').value) || null;
  const id     = parseInt(document.getElementById('edit-id').value) || Date.now();

  if (!name) { alert('กรุณาใส่ชื่อรายการ'); return; }
  if (isNaN(amount) || amount < 0) { alert('กรุณาใส่จำนวนเงินที่ถูกต้อง'); return; }

  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  btn.textContent = 'กำลังบันทึก...';
  closeSheet('edit-overlay');

  try {
    await writeAsset({ id, name, amount, category: cat }, row);
    await loadData(true);
  } catch(e) {
    setSyncState('error');
    alert('บันทึกไม่สำเร็จ: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'บันทึก';
  }
}

async function confirmDelete() {
  const row  = parseInt(document.getElementById('edit-row').value);
  const name = document.getElementById('f-name').value;
  if (!confirm(`ลบ "${name}" ออกจาก Sheet ด้วยไหม?\nการกระทำนี้ไม่สามารถยกเลิกได้`)) return;

  closeSheet('edit-overlay');
  setSyncState('syncing');
  try {
    await deleteRow(row);
    sheetIdCache = null;
    await loadData(true);
  } catch(e) {
    setSyncState('error');
    alert('ลบไม่สำเร็จ: ' + e.message);
  }
}

// ================================================================
//  GOAL SHEET
// ================================================================
function openGoalSheet() {
  document.getElementById('f-goal').value = goal;
  openSheet('goal-overlay');
}
function saveGoal() {
  const g = parseFloat(document.getElementById('f-goal').value);
  if (!(g > 0)) { alert('กรุณากรอกเป้าหมายให้ถูกต้อง'); return; }
  goal = g;
  localStorage.setItem('at_goal', String(g));
  closeSheet('goal-overlay');
  renderAll();
}

// ================================================================
//  CHART (SVG donut — no library)
// ================================================================
function openChart() {
  const total = assets.reduce((s, a) => s + a.amount, 0);

  // group by category, sorted desc
  const byCat = {};
  assets.forEach(a => { byCat[a.category] = (byCat[a.category] || 0) + a.amount; });
  const entries = Object.entries(byCat).sort((a, b) => b[1] - a[1]);

  const C = 2 * Math.PI * 46;
  let acc = 0;
  let svg = `<circle cx="60" cy="60" r="46" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="13"></circle>`;
  entries.forEach(([cat, amt]) => {
    const frac = total ? amt / total : 0;
    const dash = Math.max(frac * C - 1.5, 0.5);
    svg += `<circle cx="60" cy="60" r="46" fill="none" stroke="${getMeta(cat).color}" stroke-width="13" stroke-dasharray="${dash} ${C}" stroke-dashoffset="${-acc * C}"></circle>`;
    acc += frac;
  });
  document.getElementById('donut-svg').innerHTML = svg;
  document.getElementById('donut-total').textContent = hiddenAmts ? '฿•••••' : '฿' + fmt(total);

  document.getElementById('chart-legend').innerHTML = entries.map(([cat, amt]) => {
    const pct = total ? (amt / total * 100).toFixed(1) : '0.0';
    return `<div class="legend-row">
      <div class="legend-dot" style="background:${getMeta(cat).color}"></div>
      <div class="legend-name">${esc(cat)}</div>
      <div class="legend-val">${money(amt)}</div>
      <div class="legend-pct">${pct}%</div>
    </div>`;
  }).join('');

  openSheet('chart-overlay');
}

// ================================================================
//  SHEET HELPERS
// ================================================================
function openSheet(id)  { document.getElementById(id).classList.add('open'); }
function closeSheet(id) { document.getElementById(id).classList.remove('open'); }
function overlayClose(e, id) { if (e.target === document.getElementById(id)) closeSheet(id); }
</script>
</body>
</html>
